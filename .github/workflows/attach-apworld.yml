name: Attach APWorld to current release

on:
  push:
    branches:
      - main
    paths:
      - "release-assets/core_keeper.apworld"

permissions:
  contents: write

jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Attach APWorld
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 18); do
            if gh release upload v0.9.0-rc.8 release-assets/core_keeper.apworld --clobber; then
              exit 0
            fi
            sleep 10
          done
          exit 1

