name: Validate APWorld release asset

on:
  push:
    branches:
      - main
    paths:
      - "release-assets/core_keeper.apworld"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Confirm APWorld asset exists
        shell: bash
        run: test -s release-assets/core_keeper.apworld
